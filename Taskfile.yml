version: "3"

dotenv: [".env"]

tasks:
  repo:setup:mac:
    cmds:
      - ./scripts/repo-setup.sh

  repo:setup:
    cmds:
      - pre-commit autoupdate
      - ansible-galaxy install -r stage1/requirements.yml
      - pip install --no-cache-dir -r stage1/requirements-pip.txt

  precommit:
    cmds:
      - pre-commit run --all-files

  # MkDocs lives in its own venv rather than in the repo Dockerfile. Putting it
  # in the image would create a second version pin alongside docs/requirements.txt,
  # and a docs dependency CVE would start failing trivy-scan for the ops toolbox.
  docs:install:
    desc: Create the docs virtualenv and install MkDocs from docs/requirements.txt
    # Task re-runs this only when the pin file changes, so the other docs tasks
    # can depend on it unconditionally.
    sources:
      - docs/requirements.txt
    generates:
      - .venv-docs/bin/mkdocs
    cmds:
      - python3 -m venv .venv-docs
      - ./.venv-docs/bin/python -m pip install --quiet --upgrade pip
      - ./.venv-docs/bin/python -m pip install --quiet -r docs/requirements.txt

  docs:serve:
    desc: Serve the docs with live reload on http://127.0.0.1:8000
    deps: [docs:install]
    cmds:
      # Always from the repo root: pymdownx.snippets base paths resolve against
      # the working directory, so serving from a subdirectory breaks the
      # CONTRIBUTING/SECURITY/AGENTS includes.
      - ./.venv-docs/bin/mkdocs serve

  docs:build:
    desc: Build the docs into site/ in strict mode, where any warning is an error
    deps: [docs:install]
    cmds:
      - ./.venv-docs/bin/mkdocs build --strict

  docs:check:
    desc: Run every documentation drift gate exactly as CI does, without building
    deps: [docs:install]
    cmds:
      - bash ./scripts/sync-versions.sh --check
      - ./.venv-docs/bin/python scripts/check-docs.py --check

  stage2:preflight:check:
    desc: Assert the Prometheus CRD and stack charts package the same Operator version. Needs outbound HTTPS to GitHub.
    cmds:
      - python3 stage2/preflight/scripts/check-prometheus-chart-compatibility.py

  stage2:preflight:test:
    desc: Assert the chart compatibility gate itself. No network.
    cmds:
      - python3 stage2/preflight/tests/test_check_prometheus_chart_compatibility.py

  docs:test:
    desc: Assert the documentation drift gate itself. No network.
    # The test re-runs check-docs.py with sys.executable, which imports yaml, so
    # it needs the venv interpreter rather than whatever python3 is on PATH.
    deps: [docs:install]
    cmds:
      - ./.venv-docs/bin/python scripts/tests/test_check_docs.py

  versions:check:
    desc: Check for newer tool and Alpine package versions in Dockerfile
    cmds:
      - ./scripts/bump-versions.sh --check

  versions:bump:
    desc: Bump all tool and Alpine package versions in Dockerfile, then regenerate the README and docs version tables
    cmds:
      - ./scripts/bump-versions.sh --apply
      - ./scripts/sync-versions.sh

  docker:build:
    cmds:
      - ./scripts/docker-build.sh {{.CLI_ARGS}}

  docker:run:
    cmds:
      - ./scripts/docker-run.sh

  docker:exec:
    cmds:
      - task: docker:run
      - docker exec -it "homelab-infrastructure" /bin/bash

  docker:trivy:
    desc: Build and scan container image for vulnerabilities (matches CI workflow)
    cmds:
      # Build image with --no-cache to match CI workflow behavior
      # Per docker/build-push-action: https://github.com/docker/build-push-action#inputs
      - ./scripts/docker-build.sh --no-cache
      # Scan with Trivy matching container-security.yml workflow
      # Per Trivy CLI docs: https://trivy.dev/docs/latest/references/configuration/cli/trivy_image/
      - trivy image
        --config trivy.yaml
        --ignorefile .trivyignore.yaml
        --severity CRITICAL,HIGH
        --exit-code 1
        chrisleekr/homelab-infrastructure:latest

  # One workspace holds every cloud account, matching stage2. Accounts are selected in
  # code, one provider alias and module block each, so a single apply covers all of them.
  stage0:terraform:init:
    desc: Initialize stage0 and select the workspace
    dir: stage0
    cmds:
      - terraform init
      - terraform workspace select homelab-stage0

  stage0:terraform:init:upgrade:
    desc: Upgrade Terraform providers to latest versions satisfying constraints. Run in root and all child modules.
    cmds:
      - cd stage0 && terraform init -upgrade
      - |
        for dir in stage0/*/; do
          if [ -f "${dir}provider.tf" ]; then
            echo "Upgrading providers in ${dir}..."
            (cd "${dir}" && terraform init -upgrade -backend=false)
          fi
        done

  stage0:terraform:plan:
    desc: Plan the cloud provisioning
    dir: stage0
    deps: [stage0:terraform:init]
    cmds:
      - terraform plan

  stage0:terraform:apply:
    desc: Apply the cloud provisioning
    dir: stage0
    deps: [stage0:terraform:init]
    cmds:
      - terraform apply

  stage0:terraform:apply:retry:
    desc: Apply, retrying while Oracle reports out of host capacity. Always Free A1 capacity is frequently unavailable.
    cmds:
      - ./scripts/oci-apply-retry.sh homelab-stage0

  stage0:terraform:output:
    desc: Print the worker_hosts_json entries to paste into Bitwarden
    dir: stage0
    deps: [stage0:terraform:init]
    cmds:
      - terraform output -json worker_hosts_json_entries

  stage0:terraform:init:lock:
    desc: Regenerate stage0 provider lock files with multi-platform hashes. Run inside Docker container
    vars:
      # Three platforms, not two: darwin_arm64 for the host, linux_amd64 for CI runners,
      # linux_arm64 for the tooling container on an Apple Silicon Mac. terraform_validate
      # runs -lockfile=readonly, so a platform missing its h1 hash fails the hook rather
      # than recording one.
      PLATFORMS: -platform=darwin_arm64 -platform=linux_amd64 -platform=linux_arm64
    cmds:
      # Provider caches are per platform and .terraform is gitignored, so a cache built on
      # the host is stale the moment this runs in the container.
      - find stage0 -mindepth 1 -maxdepth 2 -name ".terraform" -type d -exec rm -rf {} +
      # The root lock must cover the child module's requirements too, so the module tree
      # has to be installed before locking. `providers lock` does not install modules.
      - cd stage0 && terraform init -backend=false && terraform providers lock {{.PLATFORMS}}
      - |
        for dir in stage0/*/; do
          if [ -f "${dir}provider.tf" ]; then
            echo "Locking providers in ${dir}..."
            (cd "${dir}" && terraform providers lock {{.PLATFORMS}})
          fi
        done

  stage0:test:
    desc: Exercise the OCI capacity retry loop against stubbed terraform and oci binaries. No cloud account, no network.
    cmds:
      - bash scripts/tests/test-oci-apply-retry.sh

  stage1:test:
    desc: Assert the kubeadm upgrade ordering statically. Needs a python3 with PyYAML, which the ansible install already provides. No cluster, no network.
    cmds:
      - python3 stage1/tests/test_upgrade_ordering.py

  stage1:ansible:syntax:
    desc: Parse every play and role without connecting to a host
    dir: stage1
    cmds:
      - ansible-playbook -i "inventories/inventory.yml" site.yml --syntax-check

  stage1:ansible:ping:
    desc: Verify access to the cluster
    dir: stage1
    cmds:
      - ansible all -i "inventories/inventory.yml" -m ping

  stage1:ansible:playbook:
    desc: Deploy complete server setup and Kubernetes cluster
    dir: stage1
    cmds:
      - ansible-playbook --ask-become-pass -i "inventories/inventory.yml" site.yml

  stage1:ansible:playbook:check:
    desc: Dry run the full playbook in check mode with diffs. Connects over SSH, applies nothing. Bootstrap tasks may report false errors in check mode.
    dir: stage1
    cmds:
      - ansible-playbook --ask-become-pass -i "inventories/inventory.yml" site.yml --check --diff

  stage1:ansible:playbook:worker:
    desc: Provision and join worker nodes only, leaving the control plane untouched
    dir: stage1
    cmds:
      - ansible-playbook --ask-become-pass -i "inventories/inventory.yml" site.yml --limit 'localhost:agent' --skip-tags post_setup

  stage2:terraform:init:
    desc: Initialize Terraform
    dir: stage2
    cmds:
      - terraform init
      - terraform workspace select homelab-stage2

  stage2:terraform:init:upgrade:
    desc: Upgrade Terraform providers to latest versions satisfying constraints. Run in root and all child modules.
    cmds:
      - cd stage2 && terraform init -upgrade
      - |
        for dir in stage2/*/; do
          if [ -f "${dir}provider.tf" ]; then
            echo "Upgrading providers in ${dir}..."
            (cd "${dir}" && terraform init -upgrade -backend=false)
          fi
        done

  stage2:terraform:init:lock:
    desc: Regenerate all provider lock files with multi-platform hashes. Run inside Docker container
    cmds:
      # Remove darwin-built provider caches from child modules. They cannot be used inside linux_amd64 Docker container.
      # Per HashiCorp Discuss: https://discuss.hashicorp.com/t/trying-to-run-terraform-validate-with-tf-plugin-cache-dir-set/64632
      - find stage2 -mindepth 2 -maxdepth 2 -name ".terraform" -type d -exec rm -rf {} +
      # Lock root module (darwin_arm64 + linux_amd64 so both macOS and Docker CI work)
      # Per HashiCorp docs: https://developer.hashicorp.com/terraform/cli/commands/providers/lock
      - cd stage2 && terraform providers lock -platform=darwin_arm64 -platform=linux_amd64
      # Lock each child module that declares its own providers.
      # terraform init -upgrade is required first to resolve any stale lock file versions
      # that no longer satisfy current version constraints in provider.tf.
      # Ref: https://developer.hashicorp.com/terraform/cli/commands/init#upgrade
      - |
        for dir in stage2/*/; do
          if [ -f "${dir}provider.tf" ]; then
            echo "Locking providers in ${dir}..."
            (cd "${dir}" && terraform providers lock -platform=darwin_arm64 -platform=linux_amd64)
          fi
        done

  stage2:terraform:plan:
    desc: Plan the Terraform deployment
    dir: stage2
    cmds:
      - terraform plan

  stage2:terraform:refresh:
    desc: Refresh Terraform state to match real infrastructure
    dir: stage2
    cmds:
      - terraform refresh

  stage2:terraform:apply:
    desc: Apply the Terraform deployment
    dir: stage2
    cmds:
      - terraform apply
