---
# Workers come from worker_hosts_json rather than static inventory entries, so the fleet
# scales by editing .env alone. An unset or empty list adds no hosts, leaving the `agent`
# group empty and every worker play a no-op: that is the single-node cluster.
- name: Register worker hosts from environment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  tasks:
    - name: Add worker hosts to agent group
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: agent
        ansible_host: "{{ item.host }}"
        ansible_user: "{{ item.user | default('ubuntu') }}"
        ansible_port: "{{ item.port | default(22) }}"
        # Extra keys become host vars. default() without its boolean arg substitutes only
        # when the key is absent, so an explicit "taints": [] survives and means
        # "schedulable". Passing `true` here would treat the empty list as falsey and
        # silently reimpose the default, making an untainted worker inexpressible.
        node_taints: "{{ item.taints | default(worker_default_taints) }}"
        node_labels: "{{ item.labels | default({}) }}"
        # Cloud workers only. node_ip pins kubelet to the tailnet address. snapd_purge
        # false preserves the Oracle Cloud Agent snap, which is what reports the A1 memory
        # metric that idle reclamation measures.
        node_ip: "{{ item.node_ip | default('') }}"
        host_setup_snapd_purge: "{{ item.snapd_purge | default(true) }}"
        # Tailnet name suffix, appended to the shared hostname prefix. Required whenever
        # tailscale_node_enable is true; the role fails fast rather than joining as "<prefix>-".
        tailscale_hostname_suffix: "{{ item.tailscale_hostname_suffix | default('') }}"
      loop: "{{ worker_hosts_json }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

- name: Server setup on cluster, not related with kubernetes
  hosts: cluster
  # serial: 1 sidesteps an ansible-core AnsiballZ module-cache race: parallel host forks
  # building the same module archive collide on the shared cache file's -part rename and
  # one fails with ENOENT (ansible/ansible#16489). Only bites plays with >1 host, which is
  # new here (host_setup moved from `hosts: server` to `hosts: cluster`). One host at a
  # time is fine at homelab scale.
  serial: 1
  become: true
  roles:
    - role: host_setup
      tags: [host_setup]
    # After host_setup, so the firewall is in a known state before the node joins a mesh.
    # The tailnet UFW rules host_setup writes reference tailscale0 before it exists, which
    # iptables accepts. Runs on every cluster node: Cilium is a full node-to-node VXLAN
    # mesh, so the workers need a path to the cloud nodes as much as the control plane does.
    - role: tailscale_node
      tags: [tailscale_node]
  handlers:
    - name: Fail2ban handlers
      ansible.builtin.import_tasks:
        file: handlers/fail2ban.yml
    - name: APT Cache handlers
      ansible.builtin.import_tasks:
        file: handlers/apt-cache.yml
    - name: Reboot handlers
      ansible.builtin.import_tasks:
        file: handlers/reboot.yml
  # Handlers flush at end of play, so a kernel cmdline change (memory cgroups) reboots
  # here, before the kubeadm plays below need a working kubelet.
  post_tasks:
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

- name: Kubernetes setup
  hosts: server
  # A half-upgraded control plane must not be followed by worker plays. Aborting the whole
  # run on the first failure keeps the cluster at a known version instead of a mixed one.
  any_errors_fatal: true
  become: true
  pre_tasks:
    - name: Gather service state information as fact data
      ansible.builtin.service_facts:
  tasks:
    - name: Setup kubeadm cluster
      when: kubernetes_cluster_type == 'kubeadm'
      tags: [kubeadm]
      block:
        - name: Include kubeadm cluster preparation
          ansible.builtin.include_role:
            name: kubeadm_pre_setup
        - name: Include kubeadm cluster server
          tags: [k8s_upgrade, cni]
          ansible.builtin.include_role:
            name: kubeadm_server
    - name: Setup minikube cluster
      when: kubernetes_cluster_type == 'minikube'
      tags: [minikube]
      block:
        - name: Include minikube cluster preparation
          ansible.builtin.include_role:
            name: minikube_pre_setup
        - name: Include minikube cluster server
          ansible.builtin.include_role:
            name: minikube_server
    - name: Setup k3s cluster
      when: kubernetes_cluster_type == 'k3s'
      tags: [k3s]
      block:
        - name: Include k3s cluster preparation
          ansible.builtin.include_role:
            name: k3s_pre_setup
        - name: Include k3s cluster server
          ansible.builtin.include_role:
            name: k3s_server
  handlers:
    - name: Sysctl handlers
      ansible.builtin.import_tasks:
        file: handlers/sysctl.yml
    - name: Systemd handlers
      ansible.builtin.import_tasks:
        file: handlers/systemd.yml
    - name: Minikube handlers
      ansible.builtin.import_tasks:
        file: handlers/minikube.yml

# Runs after the control plane is initialised, so the join target exists. Skipped entirely
# when the agent group is empty ("skipping: no hosts matched").
- name: Kubernetes worker setup
  hosts: agent
  # serial: 1 for the same AnsiballZ cache race as the cluster play above, and it also
  # serialises the join (one bootstrap token created on the control plane at a time).
  #
  # It now also carries the rolling-upgrade contract: exactly one worker is drained at a
  # time. Raising it drains N workers at once and can evict every replica of a workload.
  serial: 1
  # Combined with serial: 1, a worker that fails to drain, upgrade or come back Ready stops
  # the run before the next worker is touched.
  any_errors_fatal: true
  become: true
  pre_tasks:
    - name: Gather service state information as fact data
      ansible.builtin.service_facts:
  tasks:
    - name: Setup kubeadm worker
      when: kubernetes_cluster_type == 'kubeadm'
      tags: [kubeadm_agent]
      block:
        - name: Include kubeadm worker preparation
          ansible.builtin.include_role:
            name: kubeadm_pre_setup
        - name: Include kubeadm worker join
          tags: [k8s_upgrade]
          ansible.builtin.include_role:
            name: kubeadm_agent
  handlers:
    - name: Sysctl handlers
      ansible.builtin.import_tasks:
        file: handlers/sysctl.yml
    - name: Systemd handlers
      ansible.builtin.import_tasks:
        file: handlers/systemd.yml

# Separate play, after the agent play, because it asserts that EVERY node reports the
# target version. Run from inside the server role it would fire while the workers were
# still on the old kubelet and abort the run before they were ever upgraded.
- name: Verify the cluster converged on the target version
  hosts: server
  any_errors_fatal: true
  become: true
  tasks:
    - name: Postflight, verify the cluster converged
      when: kubernetes_cluster_type == 'kubeadm' and kubeadm_upgrade_enabled | bool
      # k8s_upgrade included so a tag-scoped run verifies what it just upgraded. apply:,
      # because a tag on a dynamic include selects only the include task, never the tasks
      # it pulls in.
      tags: [kubeadm, k8s_upgrade]
      ansible.builtin.include_role:
        name: kubeadm_server
        tasks_from: postflight-verify.yml
        apply:
          tags: [kubeadm, k8s_upgrade]

- name: Post setup on local
  hosts: localhost
  connection: local
  tasks:
    - name: Include localhost post setup
      tags: [post_setup]
      block:
        - name: Run localhost post setup
          ansible.builtin.include_role:
            name: localhost_post_setup
