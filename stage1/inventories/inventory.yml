# Worker declarations live on `all`, not on `cluster`: the add_host play that consumes
# them runs on localhost, which is not a member of `cluster`.
all:
  vars:
    # One object per worker. Unset or [] leaves the cluster single-node.
    # i.e. [{"name":"worker-01","host":"192.168.1.203","port":"2222","user":"ubuntu"}]
    worker_hosts_json: '{{ (lookup("env", "worker_hosts_json") or "[]") | from_json }}'

    # Taint for workers that do not carry their own `taints` key. A worker declared with
    # "taints": [] is explicitly schedulable.
    worker_default_taints: '{{ (lookup("env", "worker_default_taints") or worker_default_taints_fallback) | from_json }}'
    worker_default_taints_fallback: '[{"key": "node.homelab/class", "value": "low-power", "effect": "NoSchedule"}]'

local:
  hosts:
    localhost:
      ansible_connection: local

  vars:
    kubernetes_cluster_type: '{{ lookup("env", "kubernetes_cluster_type") or "kubeadm" }}'
    server_ssh_host: '{{ lookup("env", "server_ssh_host") or "192.168.1.100" }}'

cluster:
  children:
    server:
      hosts:
        server_host:
          ansible_host: '{{ lookup("env", "server_ssh_host") or "192.168.1.100" }}'
          ansible_user: '{{ lookup("env", "server_ssh_user") or "ubuntu" }}'
          ansible_port: '{{ lookup("env", "server_ssh_port") or 22 }}'
          ansible_python_interpreter: "/usr/bin/python3.12" # Explicitly specify the Python interpreter
          # Tailnet name suffix for the control plane. Workers carry their own in
          # worker_hosts_json. Read only when tailscale_node_enable is true.
          tailscale_hostname_suffix: "cp-01"

    # Worker nodes. Declared empty here and populated at runtime from worker_hosts_json
    # by the first play in site.yml. The group must exist under `cluster` for workers to
    # inherit the vars below; add_host alone would create it outside this hierarchy.
    # No ansible_python_interpreter: ansible.cfg sets interpreter_python = auto_silent,
    # which discovers the right one per host.
    agent:
      hosts: {}

  vars:
    kubernetes_cluster_type: '{{ lookup("env", "kubernetes_cluster_type") or "kubeadm" }}'

    # The CPU architecture of the Minikube redistributable, and of the control plane.
    # Also drives the stage2 GitLab module, which has no ARM64 image.
    host_machine_architecture: '{{ lookup("env", "host_machine_architecture") or "amd64" }}'

    # Per-host architecture, from gathered facts. Every binary download keys off this, so
    # an arm64 worker joining an amd64 control plane gets arm64 binaries automatically.
    node_architecture: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

    ########################
    # Start: Kubeadm
    runc_version: "1.5.1" # https://github.com/opencontainers/runc/releases
    cni_version: "1.9.1" # https://github.com/containernetworking/plugins/releases
    crictl_version: "1.36.0" # https://github.com/kubernetes-sigs/cri-tools/releases
    containerd_version: "2.3.4" # https://github.com/containerd/containerd/releases
    nerdctl_version: "2.3.5" # https://github.com/containerd/nerdctl/releases
    # Drives the kubeadm AND kubelet binary downloads, so bumping it rolls the whole fleet.
    # A bump is what arms the upgrade path; see docs/operations/kubernetes-upgrades.md.
    kubeadm_version: "1.36.3" # https://kubernetes.io/releases/
    kubectl_version: "1.36.3" # https://kubernetes.io/releases/
    kubelet_service_version: "0.21.1" # https://github.com/kubernetes/release/releases

    # Two distinct Cilium versions. cilium_version is the agent/operator release that runs
    # in the cluster; cilium_cli_version is only the local binary that drives Helm. They
    # move independently, so gating an agent upgrade on the CLI version compares unrelated
    # numbers.
    # IMPORTANT: The only tested upgrade and rollback path is between consecutive minor releases. Always perform upgrades and rollbacks between one minor release at a time. Additionally, always update to the latest patch release of your current version before attempting an upgrade.
    cilium_version: "1.20.0" # https://github.com/cilium/cilium/releases
    cilium_cli_version: "0.19.7" # https://github.com/cilium/cilium-cli/releases

    # Split avoids Cilium 1.20.0 ADS livelock; one-at-a-time rolls preserve node networking.
    # https://github.com/cilium/cilium/issues/47624
    cilium_helm_args: >-
      --helm-set envoy.xdsMode=split
      --helm-set updateStrategy.rollingUpdate.maxUnavailable=1
      --helm-set envoy.updateStrategy.rollingUpdate.maxUnavailable=1

    # This is the *underlying network* MTU, not the pod MTU. Cilium subtracts its own
    # 50-byte VXLAN overhead to derive the route MTU it installs for pods, so 1500 here
    # yields 1450 in the pod. Putting the pod figure here costs a second 50 bytes and the
    # symptom is subtle: the veth still reports the configured value while every route to
    # another node carries 50 less. Chart value is `MTU`, default 0.
    #
    # Pin rather than auto-detect. Detection follows the lowest-MTU device on the host and
    # re-runs at runtime, so tailscale0 at 1280 drags every pod in the cluster to 1230 the
    # moment the tailscale_node role runs, whether or not any worker is reached over
    # Tailscale. Pods then cannot emit cloudflared's 1308-byte QUIC Initial and every tunnel
    # handshake times out.
    #
    # Cluster-wide, so the lowest path between any two nodes wins. A worker reached over the
    # tailnet rather than the LAN needs its own measurement against that peer.
    #
    # Applied by `cilium install`, which only runs when there is no cilium-operator yet.
    # `cilium upgrade` carries the value forward (--reset-then-reuse-values defaults true)
    # but never introduces a new one, so changing this on a live cluster takes:
    #   cilium upgrade --version <cilium_version> --wait --helm-set MTU=<value>
    #   kubectl -n kube-system rollout restart ds/cilium
    # The restart is required: the agents read MTU once at start, so the ConfigMap alone
    # changes nothing.
    cilium_mtu: "1500" # LAN NIC MTU. Cilium derives the 1450 pod route MTU from it

    # Host-level Tailscale for node-to-node transport. Distinct from the stage2 vpn pod,
    # which does LAN access and exit-node duty and stays as it is.
    tailscale_node_enable: '{{ lookup("env", "tailscale_node_enable") | default(false, true) | bool }}'
    host_setup_ufw_tailnet_ports: >-
      {{ [{"port": "6443", "proto": "tcp"},
          {"port": "10250", "proto": "tcp"},
          {"port": "8472", "proto": "udp"},
          {"port": "4240", "proto": "tcp"}]
         if tailscale_node_enable | bool else [] }}

    # Deprecated-API scanner run as an upgrade preflight.
    pluto_version: "5.24.1" # https://github.com/FairwindsOps/pluto/releases

    # Escape hatch. `-e kubeadm_upgrade_enabled=false` reduces a run to install-and-join
    # only, leaving every already-bootstrapped node untouched.
    kubeadm_upgrade_enabled: true

    # Control-plane etcd snapshot and PKI copy taken before `kubeadm upgrade apply`.
    kubeadm_upgrade_backup_dir: /var/backups/kubeadm

    # Upgrade instructions
    #  https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-upgrade/
    #  https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/upgrading-linux-nodes/
    # Runbook: docs/operations/kubernetes-upgrades.md
    # Finish: Kubeadm
    ########################

    ########################
    # Start: minikube - https://github.com/gantsign/ansible_role_minikube/blob/master/vars/main.yml
    # Dir where minikube should be installed
    minikube_install_dir: "/usr/local/bin"

    # Path where minikube should be installed
    minikube_install_path: "{{ minikube_install_dir }}/minikube"

    # Mirror to download the minikube from
    minikube_mirror: "https://github.com/kubernetes/minikube/releases/download/v{{ minikube_version }}"

    # The OS of the minikube redistributable
    minikube_os: "linux"

    # File name of the minikube redistributable file
    minikube_redis_filename: "minikube-{{ minikube_os }}-{{ host_machine_architecture }}"

    # File name of the minikube download file
    minikube_download_filename: "{{ minikube_redis_filename }}-{{ minikube_version }}"

    # minikube version number
    minikube_version: "1.38.1"

    # Directory to store files downloaded for minikube
    minikube_download_dir: "{{ x_ansible_download_dir | default(ansible_facts.env.HOME + '/.ansible/tmp/downloads') }}"

    # Finish: minikube
    ########################

    ########################
    # Start: k3s vars
    k3s_version: v1.34.3+k3s1
    token: '{{ lookup("env", "k3s_token") or ""}}'
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"
    extra_server_args: "{{ lookup('env', 'k3s_extra_server_args') or '' }}"
    extra_agent_args: ""

    docker_default_data_path: '{{ lookup("env", "docker_default_data_path") or "/var/lib/docker" }}'
    etc_hosts_json: '{{ (lookup("env", "etc_hosts_json") | default("[]")) | from_json }}'

    # Optional vars
    cluster_context: k3s
    # api_port: 6443
    # k3s_server_location: /var/lib/rancher/k3s
    # systemd_dir: /etc/systemd/system
    # extra_service_envs: [ 'ENV_VAR1=VALUE1', 'ENV_VAR2=VALUE2' ]
    # user_kubectl: true, by default kubectl is symlinked and configured for use by ansible_user. Set to false to only kubectl via root user.

    # Manifests or Airgap should be either full paths or relative to the playbook directory.
    # List of locally available manifests to apply to the cluster, useful for PVCs or Traefik modifications.
    # extra_manifests: [ '/path/to/manifest1.yaml', '/path/to/manifest2.yaml' ]
    # airgap_dir: /tmp/k3s-airgap-images

    # server_config_yaml:  |
    #   This is now an inner yaml file. Maintain the indentation.
    #   YAML here will be placed as the content of /etc/rancher/k3s/config.yaml
    #   See https://docs.k3s.io/installation/configuration#configuration-file
    # registries_config_yaml:  |
    #   Containerd can be configured to connect to private registries and use them to pull images as needed by the kubelet.
    #   YAML here will be placed as the content of /etc/rancher/k3s/registries.yaml
    #   See https://docs.k3s.io/installation/private-registry
    # Finish: k3s vars
    ########################
