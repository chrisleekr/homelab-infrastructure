---
- name: Install packages
  ansible.builtin.include_tasks: install-packages.yml
  tags: [packages]

# Gated at the include, not inside the file. remove-snapd.yml guards its purge blocks with
# host_setup_snapd_purge, but "Shutdown services, sockets and timers" runs unconditionally
# and would stop and disable snapd.service. On OCI Ubuntu images the Oracle Cloud Agent is
# a snap, and it reports the memory metric that idle reclamation measures.
- name: Remove snapd
  ansible.builtin.include_tasks: remove-snapd.yml
  when: host_setup_snapd_purge | bool
  tags: [packages]

- name: Update /etc/hosts
  ansible.builtin.include_tasks: update-etc-hosts.yml
  tags: [network]

- name: Update multipath blacklist
  ansible.builtin.include_tasks: update-multipath.yml
  tags: [storage]

- name: Update sysctl settings
  ansible.builtin.include_tasks: update-sysctl.yml
  tags: [network]

- name: Install fail2ban
  ansible.builtin.include_tasks: install-fail2ban.yml
  tags: [security]

- name: Setup UFW
  ansible.builtin.include_tasks: setup-ufw.yml
  tags: [security]

- name: Disable swap
  ansible.builtin.include_tasks: disable-swap.yml
  tags: [system]

- name: Enable memory cgroup
  ansible.builtin.include_tasks: enable-memory-cgroup.yml
  tags: [system]
