---
# Node-level setup shared by the control plane (kubeadm_server) and workers
# (kubeadm_agent). Both roles pull this in via a meta dependency, so container
# runtime and kubelet stay identical across the cluster.
#
# This file only ever performs the FRESH-INSTALL path. On a node that has already joined a
# cluster, replacing binaries in place restarts the kubelet under running pods with no
# drain and no `kubeadm upgrade node`. That path belongs to the upgrade flows:
#   control plane: kubeadm_server/tasks/upgrade-control-plane.yml
#   workers:       kubeadm_agent/tasks/upgrade-node.yml
# Both reach back into this role with `tasks_from:` to reuse the same apply files.
- name: Assert the node architecture is supported
  # node_architecture (inventory) is a bare dict lookup on ansible_facts['architecture'];
  # an unsupported value (a 32-bit armv7l flash is the usual cause) would otherwise fail
  # with a cryptic KeyError the first time it is templated into a download URL.
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      Unsupported architecture '{{ ansible_facts['architecture'] }}'. Only x86_64 (amd64)
      and aarch64 (arm64) are supported; re-flash with 64-bit Ubuntu Server.
    quiet: true

- name: Detect installed versions and node state
  ansible.builtin.include_tasks:
    file: detect-versions.yml
    # A tag on an include applies to the include alone, so apply: is what keeps `always`
    # on the detection tasks during a tag-scoped run. Without it the drift facts never get set.
    # https://docs.ansible.com/projects/ansible/latest/playbook_guide/playbooks_tags.html#tag-inheritance-for-includes-blocks-and-the-apply-keyword
    apply:
      tags: [always]
  tags: [always]

- name: Install the container runtime and kubelet
  ansible.builtin.include_tasks: apply-node-runtime-and-kubelet.yml
  when: not kubeadm_node_bootstrapped
  tags: [container_runtime, container_tools, k8s_install]

- name: Install the kubeadm binary
  ansible.builtin.include_tasks: apply-kubeadm-binary.yml
  when: not kubeadm_node_bootstrapped
  tags: [k8s_install]

# Unconditional, unlike the two above: this reconciles on every pass rather than only on a
# fresh install, and it must be in place before kubeadm init or join starts kubelet.
- name: Pin kubelet to the node IP
  ansible.builtin.include_tasks: pin-node-ip.yml
  tags: [always]
