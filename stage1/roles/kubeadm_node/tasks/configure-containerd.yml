---
# Pure installer. Detection lives in detect-versions.yml.
- name: Install or upgrade containerd
  when: kubeadm_node_containerd_upgrade_required | bool
  block:
    - name: Download containerd tarball
      vars:
        base_url: "https://github.com/containerd/containerd/releases/download"
        path: "containerd-{{ containerd_version }}-linux-{{ node_architecture }}.tar.gz"
      ansible.builtin.get_url:
        url: "{{ base_url }}/v{{ containerd_version }}/{{ path }}"
        dest: "/tmp/{{ path }}"
        mode: "0644"
        force: true

    - name: Extract containerd tarball to /usr/local
      ansible.builtin.unarchive:
        src: "/tmp/containerd-{{ containerd_version }}-linux-{{ node_architecture }}.tar.gz"
        dest: /usr/local
        remote_src: true

    - name: Download containerd.service file
      # Pinned to the tag installed two tasks above, not `main`. A floating branch means the
      # unit file and the binary can disagree, and this now runs unattended inside the
      # worker roll rather than only on a fresh build.
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/containerd/containerd/v{{ containerd_version }}/containerd.service"
        dest: /lib/systemd/system/containerd.service
        mode: "0644"

    - name: Reload systemd daemon and enable containerd service
      ansible.builtin.systemd:
        daemon_reload: true
        enabled: true
        state: started
        name: containerd

    - name: Create /etc/containerd directory if it doesn't exist already.
      ansible.builtin.file:
        path: /etc/containerd/
        state: directory
        mode: "0755"

    - name: Generate default containerd config
      ansible.builtin.command: containerd config default
      register: kubeadm_node_containerd_default_config
      changed_when: false

    - name: Write containerd config.toml with SystemdCgroup enabled
      ansible.builtin.copy:
        content: "{{ kubeadm_node_containerd_default_config.stdout
                     | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
        dest: /etc/containerd/config.toml
        mode: "0644"

    # Direct restart, not notify: `meta: flush_handlers` is play-wide and would also fire
    # unrelated pending handlers. Unconditional here because the block only runs when
    # containerd changed, and kubeadm init needs the runtime up before it starts.
    - name: Restart containerd to load the new config
      ansible.builtin.systemd:
        name: containerd
        state: restarted
