---
# Pure installer. Detection lives in detect-versions.yml.
- name: Install or upgrade nerdctl
  when: kubeadm_node_nerdctl_upgrade_required | bool
  block:
    - name: Download nerdctl
      vars:
        base_url: "https://github.com/containerd/nerdctl/releases/download"
        path: "nerdctl-{{ nerdctl_version }}-linux-{{ node_architecture }}.tar.gz"
      ansible.builtin.get_url:
        url: "{{ base_url }}/v{{ nerdctl_version }}/{{ path }}"
        dest: /tmp/nerdctl.tar.gz
        mode: "0644"
        # Without force the cached /tmp tarball from the previous version is reused and the
        # "upgrade" silently reinstalls the old binary.
        force: true

    - name: Extract nerdctl
      ansible.builtin.unarchive:
        src: /tmp/nerdctl.tar.gz
        dest: /usr/local/bin/
        remote_src: true

    - name: Verify nerdctl version after download
      ansible.builtin.command: /usr/local/bin/nerdctl --version
      register: kubeadm_node_nerdctl_post_download_version
      changed_when: false

    - name: Display downloaded nerdctl version
      ansible.builtin.debug:
        msg: "{{ kubeadm_node_nerdctl_post_download_version.stdout_lines[0] | default('unknown') }}"
