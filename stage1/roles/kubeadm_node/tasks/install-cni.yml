---
# Pure installer. Detection lives in detect-versions.yml.
- name: Install or upgrade CNI
  when: kubeadm_node_cni_upgrade_required | bool
  # Block-scoped so the download and the extract cannot drift apart. The filename carries the
  # version, so a bump lands on a new path and never reuses a cached tarball.
  vars:
    kubeadm_node_cni_archive: "cni-plugins-linux-{{ node_architecture }}-v{{ cni_version }}.tgz"
  block:
    - name: Download CNI plugins
      ansible.builtin.get_url:
        url: >-
          https://github.com/containernetworking/plugins/releases/download/v{{ cni_version }}/{{ kubeadm_node_cni_archive }}
        dest: "/tmp/{{ kubeadm_node_cni_archive }}"
        mode: "0644"
        force: true

    - name: Ensure CNI bin directory exists
      ansible.builtin.file:
        path: /opt/cni/bin
        state: directory
        mode: "0644"

    - name: Extract CNI plugins to bin directory
      ansible.builtin.unarchive:
        src: "/tmp/{{ kubeadm_node_cni_archive }}"
        dest: /opt/cni/bin/
        remote_src: true

    - name: Verify CNI version after download
      ansible.builtin.command: /opt/cni/bin/macvlan --version
      register: kubeadm_node_cni_post_download_version
      changed_when: false

    - name: Display downloaded CNI version
      ansible.builtin.debug:
        # macvlan --version writes to stderr.
        msg: "{{ kubeadm_node_cni_post_download_version.stderr_lines[0] | default('unknown') }}"
