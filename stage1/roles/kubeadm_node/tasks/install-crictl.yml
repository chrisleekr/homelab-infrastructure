---
# Pure installer. Detection lives in detect-versions.yml.
- name: Install or upgrade crictl
  when: kubeadm_node_crictl_upgrade_required | bool
  block:
    - name: Download crictl
      vars:
        base_url: "https://github.com/kubernetes-sigs/cri-tools/releases/download"
        path: "crictl-v{{ crictl_version }}-linux-{{ node_architecture }}.tar.gz"
      ansible.builtin.get_url:
        url: "{{ base_url }}/v{{ crictl_version }}/{{ path }}"
        dest: /tmp/crictl.tar.gz
        mode: "0644"
        force: true

    - name: Extract crictl
      ansible.builtin.unarchive:
        src: /tmp/crictl.tar.gz
        dest: /usr/local/bin/
        remote_src: true

    - name: Verify crictl version after download
      ansible.builtin.command: /usr/local/bin/crictl --version
      register: kubeadm_node_crictl_post_download_version
      changed_when: false

    - name: Display downloaded crictl version
      ansible.builtin.debug:
        msg: "{{ kubeadm_node_crictl_post_download_version.stdout_lines[0] | default('unknown') }}"
