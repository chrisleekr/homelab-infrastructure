---
# Canonical slash-free form: kubernetes.core >= 6.5.0 rstrips "/" from the declared repo_url
# before both the add and the idempotency compare. A host whose repositories.yaml still holds
# the old slashed URL fails until a one-time `helm repo remove metrics-server`.
# https://github.com/ansible-collections/kubernetes.core/pull/1121
- name: Add Helm repository for metrics-server
  kubernetes.core.helm_repository:
    name: metrics-server
    repo_url: https://kubernetes-sigs.github.io/metrics-server

- name: Install metrics-server using Helm
  kubernetes.core.helm:
    name: metrics-server
    chart_ref: metrics-server/metrics-server
    release_namespace: kube-system
    state: present
    create_namespace: true
    # https://github.com/kubernetes-sigs/metrics-server/blob/master/charts/metrics-server/values.yaml
    values:
      replicas: 1
      args: ['--kubelet-insecure-tls']
      serviceMonitor:
        enabled: true
      # See https://github.com/kubernetes-sigs/metrics-server#scaling
      resources:
        requests:
          cpu: 11m
          memory: 62Mi
        # limits:
        #   cpu:
        #   memory:
