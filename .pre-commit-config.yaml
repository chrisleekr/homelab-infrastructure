---
# Refer: https://github.com/techtales-io/terraform-minio/blob/main/.pre-commit-config.yaml
fail_fast: false
default_stages:
  - pre-commit
  - pre-push

# exclude: "^assets/"

repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        args:
          - --project-dir=./stage1
          - --exclude=container/
          # mkdocs.yml carries `!!python/name:` tags for the pymdownx mermaid and
          # emoji extensions, which ansible-lint's safe loader rejects as
          # load-failure. It must be excluded here rather than in
          # stage1/.ansible-lint, whose exclude_paths resolve relative to that
          # file and so cannot name a repo-root path.
          - --exclude=mkdocs.yml
        # Uncomment if you need the full Ansible community bundle instead of ansible-core:
        additional_dependencies:
          - ansible

  # Ordering guard for the kubeadm rolling upgrade. Static parse of the stage1 Ansible
  # tree; ansible-lint cannot see that a drain must follow `kubeadm upgrade node`.
  - repo: local
    hooks:
      - id: ansible-upgrade-ordering
        name: kubeadm upgrade ordering
        # Invoked through the interpreter rather than as an executable, so the hook does not
        # depend on the file mode. Docker Desktop's macOS mount translation reports every
        # file as executable, which makes committed mode bits unreliable here.
        entry: python stage1/tests/test_upgrade_ordering.py
        language: python
        additional_dependencies:
          - PyYAML==6.0.3
        pass_filenames: false
        files: ^stage1/(site\.yml|roles/kubeadm_(node|server|agent)/|tests/)

      # Documentation drift gate. Static parse of mkdocs.yml nav plus the docs/
      # tree against the stage1 role and stage2 module directories. MkDocs itself
      # is not required, so the only dependency is PyYAML - same contract as the
      # ansible-upgrade-ordering hook above.
      - id: docs-drift
        name: documentation drift (coverage, citations, orphans, typography, wrapping)
        entry: python scripts/check-docs.py --check
        language: python
        additional_dependencies:
          - PyYAML==6.0.3
        pass_filenames: false
        # No `files:` filter, deliberately. The typography check reads every
        # tracked text file, so any path-scoped regex would let an em dash in an
        # unlisted file reach master with only CI to catch it. The whole gate
        # runs in well under a second, so scoping buys nothing.

      # Guards the drift gate above. Its failure modes are all silent-pass, so a
      # regression would leave CI green while checking nothing.
      - id: docs-drift-tests
        name: documentation drift gate self-test
        entry: python scripts/tests/test_check_docs.py
        language: python
        additional_dependencies:
          - PyYAML==6.0.3
        pass_filenames: false
        files: ^scripts/(check-docs\.py|tests/test_check_docs\.py)$

      # Guards the Prometheus chart compatibility gate. Both of its failure directions
      # are silent: the wrong pin fails open, an unowned pin fails closed on every plan.
      # The gate itself needs network, so only its self-test runs here.
      - id: preflight-compat-tests
        name: prometheus chart compatibility gate self-test
        entry: python stage2/preflight/tests/test_check_prometheus_chart_compatibility.py
        language: python
        pass_filenames: false
        files: ^stage2/preflight/(scripts/check-prometheus-chart-compatibility\.py|tests/)

      # Version-pin drift. Regenerates the sentinel blocks in README.md and
      # docs/reference/versions.md from Dockerfile ARGs and inventory.yml, and
      # rewrites every <!--v:key--> span, then diffs.
      - id: docs-versions
        name: version pins in sync (Dockerfile + inventory -> README + docs)
        # `language: system` with an explicit bash, for the same mode-bit reason
        # as the hook above.
        entry: bash scripts/sync-versions.sh --check
        language: system
        pass_filenames: false
        files: ^(Dockerfile|stage1/inventories/inventory\.yml|README\.md|docs/.*\.md|scripts/sync-versions\.sh)$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        exclude: "^[^/]+$"
        args:
          # Optimization: Skip backend init (not needed for validation)
          # Ref: https://developer.hashicorp.com/terraform/cli/commands/init#backend-false
          - --tf-init-args=-backend=false
          # Optimization: Don't modify lockfile during init
          # Ref: https://github.com/antonbabenko/pre-commit-terraform#terraform_validate
          - --tf-init-args=-lockfile=readonly
      - id: terraform_trivy
        args:
          # Use --ignorefile for suppression rules, not --config (which is for trivy.yaml)
          # Ref: https://trivy.dev/docs/latest/configuration/filtering/#trivyignoreyaml
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore.yaml
          # Ignore generated local state; its tracked source remains under scripts/container.
          - --args=--skip-dirs=__GIT_WORKING_DIR__/container
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for files that contain merge conflict strings.
      - id: check-merge-conflict
      # Prevent giant files from being committed. default=500kB
      - id: check-added-large-files
        args:
          - --maxkb=1000
      # Check for files with names that would conflict on a case-insensitive filesystem like MacOS HFS+ or Windows FAT.
      - id: check-case-conflict
      # Checks that non-binary executables have a proper shebang.
      # Limited to shell scripts to avoid false positives from Docker Desktop
      # macOS volume mount permission translation (all files appear executable).
      # Ref: https://docs.docker.com/desktop/settings-and-maintenance/settings/#file-sharing
      - id: check-executables-have-shebangs
        files: \.sh$
      # Attempts to load all json files to verify syntax.
      - id: check-json
      # Checks for symlinks which do not point to anything.
      - id: check-symlinks
      # Checks for the existence of private keys.
      - id: detect-private-key
      # Makes sure files end in a newline and only a newline.
      - id: end-of-file-fixer
      # Removes UTF-8 byte order marker
      - id: fix-byte-order-marker
      # Replaces or checks mixed line ending.
      - id: mixed-line-ending
        args:
          - --fix=auto
      # trailing-whitespace
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      # Protect specific branches from direct checkins.
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows `source` directives across files
        args: ["-x"]
