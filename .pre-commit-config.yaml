---
# Refer: https://github.com/techtales-io/terraform-minio/blob/main/.pre-commit-config.yaml
fail_fast: false
default_stages:
  - pre-commit
  - pre-push

# exclude: "^assets/"

repos:
  - repo: https://github.com/ansible/ansible-lint
    rev: v26.6.0
    hooks:
      - id: ansible-lint
        # Override Python 3.13 requirement - Alpine 3.21 has Python 3.12
        language_version: python3.12
        args:
          - --project-dir=./stage1
          - --exclude=container/
        # Uncomment if you need the full Ansible community bundle instead of ansible-core:
        additional_dependencies:
          - ansible

  # Ordering guard for the kubeadm rolling upgrade. Static parse of the stage1 Ansible
  # tree; ansible-lint cannot see that a drain must follow `kubeadm upgrade node`.
  - repo: local
    hooks:
      - id: ansible-upgrade-ordering
        name: kubeadm upgrade ordering
        # Invoked through the interpreter rather than as an executable, so the hook does not
        # depend on the file mode. Docker Desktop's macOS mount translation reports every
        # file as executable, which makes committed mode bits unreliable here.
        entry: python stage1/tests/test_upgrade_ordering.py
        language: python
        additional_dependencies:
          - PyYAML
        pass_filenames: false
        files: ^stage1/(site\.yml|roles/kubeadm_(node|server|agent)/|tests/)

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        exclude: "^[^/]+$"
        args:
          # Optimization: Skip backend init (not needed for validation)
          # Ref: https://developer.hashicorp.com/terraform/cli/commands/init#backend-false
          - --tf-init-args=-backend=false
          # Optimization: Don't modify lockfile during init
          # Ref: https://github.com/antonbabenko/pre-commit-terraform#terraform_validate
          - --tf-init-args=-lockfile=readonly
      - id: terraform_trivy
        args:
          # Use --ignorefile for suppression rules, not --config (which is for trivy.yaml)
          # Ref: https://trivy.dev/docs/latest/configuration/filtering/#trivyignoreyaml
          - --args=--ignorefile=__GIT_WORKING_DIR__/.trivyignore.yaml
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for files that contain merge conflict strings.
      - id: check-merge-conflict
      # Prevent giant files from being committed. default=500kB
      - id: check-added-large-files
        args:
          - --maxkb=1000
      # Check for files with names that would conflict on a case-insensitive filesystem like MacOS HFS+ or Windows FAT.
      - id: check-case-conflict
      # Checks that non-binary executables have a proper shebang.
      # Limited to shell scripts to avoid false positives from Docker Desktop
      # macOS volume mount permission translation (all files appear executable).
      # Ref: https://docs.docker.com/desktop/settings-and-maintenance/settings/#file-sharing
      - id: check-executables-have-shebangs
        files: \.sh$
      # Attempts to load all json files to verify syntax.
      - id: check-json
      # Checks for symlinks which do not point to anything.
      - id: check-symlinks
      # Checks for the existence of private keys.
      - id: detect-private-key
      # Makes sure files end in a newline and only a newline.
      - id: end-of-file-fixer
      # Removes UTF-8 byte order marker
      - id: fix-byte-order-marker
      # Replaces or checks mixed line ending.
      - id: mixed-line-ending
        args:
          - --fix=auto
      # trailing-whitespace
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      # Protect specific branches from direct checkins.
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        # -x follows `source` directives across files
        args: ["-x"]
