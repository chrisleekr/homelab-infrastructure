# Trivy ignore file (YAML format)
# Reference: https://trivy.dev/docs/latest/configuration/filtering/#trivyignoreyaml
# Note: Misconfiguration IDs use DS- format (not AVD-DS-)
#
# Active vulnerability exceptions are time-bounded and scoped to exact package versions.
# Risk owner: repository maintainer.
# Re-evaluate on expired_at and drop entries once official rebuilt artifacts clear the finding.

vulnerabilities:
  # pip 26.2.2, the latest release, still vendors these exact versions. Their runtime surfaces are
  # absent from pip's vendor tree. Recheck when pip changes its vendor tree.
  - id: GHSA-6v7p-g79w-8964
    purls:
      - pkg:pypi/msgpack@1.1.2
    statement: pip uses msgpack fallback.Unpacker and the image contains no _cmsgpack extension
    expired_at: 2026-11-15

  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: pip retains only pkg_resources from setuptools; the affected setuptools.package_index module is absent
    expired_at: 2026-11-15

  # The urllib3 the venvs install is 2.8.0, so only pip's own downloads use the vendored 2.7.0.
  - id: CVE-2026-97687
    purls:
      - pkg:pypi/urllib3@2.7.0
    statement: Accept pip vendored urllib3 proxy TLS risk until pip vendors urllib3 2.8.0 or later
    expired_at: 2026-11-15

  - id: CVE-2026-97689
    purls:
      - pkg:pypi/urllib3@2.7.0
    statement: Accept pip vendored urllib3 chunk parser risk until pip vendors urllib3 2.8.0 or later
    expired_at: 2026-11-15

  # Every pinned Go CLI is its latest upstream release. Exact PURLs make rebuilt versions visible.
  # stdlib per binary: TFLint v0.64.0 = 1.26.3, kubectl 1.36.5 = 1.26.8, Terraform 1.17.0 = 1.26.10,
  # Task 3.54.0 = 1.27.1, Helm 4.3.1 = 1.27.2, Trivy 0.76.1 = 1.27.3.
  - id: CVE-2026-27145
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib x509 DNS risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-33818
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib asn1 recursion risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-39821
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib IDNA risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-39822
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib os.Root risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-42504
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib MIME risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-46600
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib DNS parsing risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-56853
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib HTTP/2 risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-56858
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib HTML template risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-56859
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib XML parsing risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-56860
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib URL parsing risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-56862
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib TLS KeyUpdate risk until official binaries use a fixed Go release
    expired_at: 2026-11-15

  - id: CVE-2026-78667
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.8
      - pkg:golang/stdlib@v1.27.1
    statement: Accept CLI HTTP Range DoS risk until official binaries use Go 1.26.9 or 1.27.2 or later
    expired_at: 2026-11-15

  - id: CVE-2026-78669
    purls:
      - pkg:golang/golang.org/x/net@v0.56.0 # kubectl, TFLint
      - pkg:golang/golang.org/x/net@v0.59.0 # Task
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.8
      - pkg:golang/stdlib@v1.27.1
    statement: Accept CLI HTTP/2 SETTINGS DoS risk until official binaries use x/net 0.60.0 and Go 1.26.9 or 1.27.2 or later
    expired_at: 2026-11-15

  - id: CVE-2026-97031
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.8
      - pkg:golang/stdlib@v1.27.1
    statement: Accept CLI TLS ECH DoS risk until official binaries use Go 1.26.9 or 1.27.2 or later
    expired_at: 2026-11-15

  - id: CVE-2026-111943
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.8
      - pkg:golang/stdlib@v1.27.1
      - pkg:golang/stdlib@v1.27.2
    statement: Mitigated, ca-certificates 20261020-r0 drops emSign ECC Root CA - G3 from the system store. Drop when binaries use Go 1.26.10 or 1.27.3 or later
    expired_at: 2026-11-15

  - id: CVE-2026-56851
    purls:
      - pkg:golang/golang.org/x/text@v0.39.0 # kubectl, TFLint
    statement: Accept CLI x/text Nickname DoS risk until official binaries include x/text 0.41.0 or later
    expired_at: 2026-11-15

  - id: CVE-2026-63209
    purls:
      - pkg:golang/github.com/klauspost/compress@v1.18.6 # TFLint
    statement: Accept TFLint compress dictionary DoS risk until an official rebuild includes klauspost/compress 1.18.7 or later
    expired_at: 2026-11-15

  # GO-2026-6303 affected symbols are ssh.NewServerConn and connection.serverAuthenticate.
  # TFLint uses x/crypto/ssh as a client only, so the server auth path is unreachable.
  - id: CVE-2026-56854
    purls:
      - pkg:golang/golang.org/x/crypto@v0.53.0 # TFLint
    statement: Not reachable, server-side only. Drop when TFLint ships x/crypto 0.55.0 or later
    expired_at: 2026-11-15

  - id: CVE-2026-56864
    purls:
      - pkg:golang/golang.org/x/mod@v0.37.0 # TFLint
    statement: Accept TFLint GOSUMDB risk until an official rebuild includes x/mod 0.40.0 or later
    expired_at: 2026-11-15

  - id: CVE-2026-56865
    purls:
      - pkg:golang/golang.org/x/mod@v0.37.0 # TFLint
    statement: Accept TFLint GOPROXY sumdb risk until an official rebuild includes x/mod 0.40.0 or later
    expired_at: 2026-11-15

  - id: GHSA-hrxh-6v49-42gf
    purls:
      - pkg:golang/google.golang.org/grpc@v1.82.0 # TFLint
    statement: Accept TFLint xDS risk until official binaries include gRPC-Go 1.82.1 or later
    expired_at: 2026-11-15

  - id: CVE-2026-84304
    purls:
      - pkg:golang/google.golang.org/grpc@v1.82.0 # TFLint
    statement: Accept TFLint gRPC risk until official binaries include gRPC-Go 1.83.1 or later
    expired_at: 2026-11-15

  # GHSA-2v4p-qf9q-27wj only affects servers created with xds.NewGRPCServer. TFLint uses gRPC for
  # local plugin transport only and never starts an xDS server.
  - id: CVE-2026-84445
    purls:
      - pkg:golang/google.golang.org/grpc@v1.82.0 # TFLint
    statement: Not reachable, xDS server only. Drop when TFLint ships gRPC-Go 1.82.2 or 1.83.2 or later
    expired_at: 2026-11-15

misconfigurations:
  # Dockerfile checks - acceptable for this use case
  - id: DS-0002
    statement: Image needs root privileges for Ansible/Terraform operations
  - id: DS-0026
    statement: No HEALTHCHECK needed - not a cloud container
  - id: DS-0011
    statement: Ansible Jinja2 template - Trivy misparses role_name as COPY args
