# Trivy ignore file (YAML format)
# Reference: https://trivy.dev/docs/latest/configuration/filtering/#trivyignoreyaml
# Note: Misconfiguration IDs use DS- format (not AVD-DS-)
#
# Active vulnerability exceptions are time-bounded and scoped to exact package versions.
# Risk owner: repository maintainer.
# Re-evaluate on expired_at and drop entries once official rebuilt artifacts clear the finding.

vulnerabilities:
  # pip 26.3 vendors no vulnerable msgpack or urllib3. The setuptools below is the one pip bundles.
  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: pip retains only pkg_resources from setuptools; the affected setuptools.package_index module is absent
    expired_at: 2026-11-15

  # Every pinned Go CLI is its latest upstream release. Exact PURLs make rebuilt versions visible.
  # stdlib per binary: kubectl 1.37.2, TFLint v0.65.0 and Terraform 1.17.1 = 1.26.10,
  # Task 3.54.0 = 1.27.1, Helm 4.3.1 = 1.27.2, Trivy 0.76.2 = 1.27.3.
  - id: CVE-2026-78667
    purls:
      - pkg:golang/stdlib@v1.27.1
    statement: Accept CLI HTTP Range DoS risk until official binaries use Go 1.26.9 or 1.27.2 or later
    expired_at: 2026-11-15

  - id: CVE-2026-78669
    purls:
      - pkg:golang/golang.org/x/net@v0.57.0 # kubectl
      - pkg:golang/golang.org/x/net@v0.59.0 # Task
      - pkg:golang/stdlib@v1.27.1
    statement: Accept CLI HTTP/2 SETTINGS DoS risk until official binaries use x/net 0.60.0 and Go 1.26.9 or 1.27.2 or later
    expired_at: 2026-11-15

  - id: CVE-2026-97031
    purls:
      - pkg:golang/stdlib@v1.27.1
    statement: Accept CLI TLS ECH DoS risk until official binaries use Go 1.26.9 or 1.27.2 or later
    expired_at: 2026-11-15

  - id: CVE-2026-111943
    purls:
      - pkg:golang/stdlib@v1.27.1
      - pkg:golang/stdlib@v1.27.2
    statement: Mitigated, ca-certificates 20261020-r0 drops emSign ECC Root CA - G3 from the system store. Drop when binaries use Go 1.26.10 or 1.27.3 or later
    expired_at: 2026-11-15

  - id: CVE-2026-56851
    purls:
      - pkg:golang/golang.org/x/text@v0.40.0 # kubectl
    statement: Accept CLI x/text Nickname DoS risk until official binaries include x/text 0.41.0 or later
    expired_at: 2026-11-15

  - id: CVE-2026-116587
    purls:
      - pkg:golang/github.com/go-jose/go-jose/v4@v4.1.4 # Task, TFLint
    statement: Accept CLI go-jose DoS risk until official binaries include go-jose 4.1.6 or later
    expired_at: 2026-11-15

misconfigurations:
  # Dockerfile checks - acceptable for this use case
  - id: DS-0002
    statement: Image needs root privileges for Ansible/Terraform operations
  - id: DS-0026
    statement: No HEALTHCHECK needed - not a cloud container
  - id: DS-0011
    statement: Ansible Jinja2 template - Trivy misparses role_name as COPY args
