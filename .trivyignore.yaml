      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
      - pkg:golang/stdlib@v1.26.5
    statement: Accept current CLI TLS risk until official binaries use Go 1.25.13 or 1.26.6 or later
    expired_at: 2026-09-15

  - id: GHSA-hrxh-6v49-42gf
    purls:
      - pkg:golang/google.golang.org/grpc@v1.82.0
    statement: Accept TFLint xDS risk until official binaries include gRPC-Go 1.82.1 or later
    expired_at: 2026-09-15

  # x/mod 0.40.0 carries the fix. Terraform 1.16.1 already ships it, so only TFLint is listed:
  # v0.64.0 is the latest release and still vendors 0.37.0, as an indirect dependency.
  - id: CVE-2026-56864
    purls:
      - pkg:golang/golang.org/x/mod@v0.37.0
    statement: Accept TFLint GOSUMDB risk until an official rebuild includes x/mod 0.40.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-56865
    purls:
      - pkg:golang/golang.org/x/mod@v0.37.0
    statement: Accept TFLint GOPROXY sumdb risk until an official rebuild includes x/mod 0.40.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-84304
    purls:
      - pkg:golang/google.golang.org/grpc@v1.82.0 # TFLint v0.64.0
      - pkg:golang/google.golang.org/grpc@v1.82.1 # Helm 4.2.4, Trivy 0.74.0
      - pkg:golang/google.golang.org/grpc@v1.83.0 # Task 3.53.1
    statement: Accept Helm, TFLint, Task and Trivy gRPC risk until official binaries include gRPC-Go 1.83.1 or later
    expired_at: 2026-09-15

misconfigurations:
  # Dockerfile checks - acceptable for this use case
  - id: DS-0002
    statement: Image needs root privileges for Ansible/Terraform operations
  - id: DS-0026
    statement: No HEALTHCHECK needed - not a cloud container
  - id: DS-0011
    statement: Ansible Jinja2 template - Trivy misparses role_name as COPY args
