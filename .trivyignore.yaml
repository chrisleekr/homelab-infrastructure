# Trivy ignore file (YAML format)
# Reference: https://trivy.dev/docs/latest/configuration/filtering/#trivyignoreyaml
# Note: Misconfiguration IDs use DS- format (not AVD-DS-)
#
# Active vulnerability exceptions are time-bounded and scoped to exact package versions.
# Risk owner: repository maintainer.
# Re-evaluate on expired_at and drop entries once official rebuilt artifacts clear the finding.

vulnerabilities:
  # pip 26.1.2 vendors implementations that do not contain the affected runtime surfaces.
  # Recheck when pip changes its vendor tree.
  - id: GHSA-6v7p-g79w-8964
    purls:
      - pkg:pypi/msgpack@1.1.2
    statement: pip uses msgpack fallback.Unpacker and the image contains no _cmsgpack extension
    expired_at: 2026-09-15

  - id: CVE-2025-47273
    purls:
      - pkg:pypi/setuptools@70.3.0
    statement: pip retains only pkg_resources from setuptools; the affected setuptools.package_index module is absent
    expired_at: 2026-09-15

  # Latest official Go CLI binaries remain affected. Exact PURLs make rebuilt versions visible.
  - id: CVE-2026-25681
    purls:
      - pkg:golang/golang.org/x/net@v0.49.0
    statement: Accept kubectl x/net HTML risk until an official rebuild includes x/net 0.55.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-27136
    purls:
      - pkg:golang/golang.org/x/net@v0.49.0
    statement: Accept kubectl x/net HTML risk until an official rebuild includes x/net 0.55.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-27145
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint stdlib risk until official binaries use a fixed Go release
    expired_at: 2026-09-15

  - id: CVE-2026-33814
    purls:
      - pkg:golang/golang.org/x/net@v0.49.0
    statement: Accept kubectl x/net HTTP/2 risk until an official rebuild includes x/net 0.53.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-33818
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
      - pkg:golang/stdlib@v1.26.5
    statement: Accept current CLI stdlib risk until official binaries use Go 1.25.13 or 1.26.6 or later
    expired_at: 2026-09-15

  - id: CVE-2026-39821
    purls:
      - pkg:golang/golang.org/x/net@v0.49.0
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
      - pkg:golang/stdlib@v1.26.5
    statement: Accept current CLI IDNA risk until official binaries include the fixed x/net and Go releases
    expired_at: 2026-09-15

  - id: CVE-2026-39822
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
    statement: Accept Terraform and TFLint os.Root risk until official binaries use a fixed Go release
    expired_at: 2026-09-15

  - id: CVE-2026-42504
    purls:
      - pkg:golang/stdlib@v1.26.3
    statement: Accept TFLint MIME risk until official binaries use a fixed Go release
    expired_at: 2026-09-15

  - id: CVE-2026-46600
    purls:
      - pkg:golang/golang.org/x/net@v0.49.0
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
      - pkg:golang/stdlib@v1.26.5
    statement: Accept current CLI DNS parsing risk until official binaries include x/net 0.56.0 and Go 1.26.6 or later
    expired_at: 2026-09-15

  - id: CVE-2026-50163
    purls:
      - pkg:golang/oras.land/oras-go/v2@v2.6.1
    statement: Accept Helm ORAS hardlink risk until an official rebuild includes oras-go 2.6.2 or later
    expired_at: 2026-09-15

  - id: CVE-2026-56852
    purls:
      - pkg:golang/golang.org/x/text@v0.33.0
    statement: Accept kubectl UTF-8 parsing risk until official binaries include x/text 0.39.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-56853
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
      - pkg:golang/stdlib@v1.26.5
    statement: Accept current CLI HTTP/2 risk until official binaries use Go 1.25.13 or 1.26.6 or later
    expired_at: 2026-09-15

  # GO-2026-6303 affected symbols are ssh.NewServerConn and connection.serverAuthenticate.
  # Helm and TFLint use x/crypto/ssh as clients only, so the server auth path is unreachable.
  - id: CVE-2026-56854
    purls:
      - pkg:golang/golang.org/x/crypto@v0.53.0 # TFLint v0.64.0
      - pkg:golang/golang.org/x/crypto@v0.54.0 # Helm 4.2.4
    statement: Not reachable, server-side only. Drop when Helm and TFLint ship x/crypto 0.55.0 or later
    expired_at: 2026-09-15

  - id: CVE-2026-56858
    purls:
      - pkg:golang/stdlib@v1.26.3
      - pkg:golang/stdlib@v1.26.4
      - pkg:golang/stdlib@v1.26.5
    statement: Accept current CLI HTML template risk until official binaries use Go 1.25.13 or 1.26.6 or later
    expired_at: 2026-09-15

