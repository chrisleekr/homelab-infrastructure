default:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker

variables:
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: 1
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

.before_script_template: &before-script
  before_script:
    - apk add curl git jq
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create docker-container
    - docker buildx create --use docker-container --driver docker-container  --buildkitd-flags '--allow-insecure-entitlement network.host'

stages:
  - build
  - test
  - docs

docker-build-dev:
  stage: build
  except:
    - master
    - main
  interruptible: true
  <<: *before-script
  script:
    - mkdir -p container && cp -r scripts/container/* container
    - docker buildx build
      --platform linux/amd64,linux/arm64
      --allow network.host
      --provenance false
      --pull
      --cache-from type=registry,ref=$CI_REGISTRY/chrisleekr/homelab-infrastructure:cache
      --cache-to type=registry,ref=$CI_REGISTRY/chrisleekr/homelab-infrastructure:cache,oci-mediatypes=true,image-manifest=true
      --tag $CI_REGISTRY/chrisleekr/homelab-infrastructure:dev-${CI_COMMIT_REF_SLUG}
      --push .


docker-build:
  stage: build
  only:
    - master
    - main
  <<: *before-script
  # Use --provenance false to avoid the following error:
  #   https://gitlab.com/gitlab-org/gitlab/-/issues/389577
  script:
    - mkdir -p container && cp -r scripts/container/* container
    - docker buildx build
      --platform linux/amd64,linux/arm64
      --allow network.host
      --provenance false
      --pull
      --cache-from type=registry,ref=$CI_REGISTRY/chrisleekr/homelab-infrastructure:cache
      --cache-to type=registry,ref=$CI_REGISTRY/chrisleekr/homelab-infrastructure:cache,oci-mediatypes=true,image-manifest=true
      --tag $CI_REGISTRY/chrisleekr/homelab-infrastructure:latest
      --tag $CI_REGISTRY/chrisleekr/homelab-infrastructure:v$(cat version.txt)
      --push .

# Container security scanning with Trivy
# Per Trivy GitLab CI documentation: https://trivy.dev/docs/latest/tutorials/integrations/gitlab-ci/
trivy-scan-dev:
  stage: test
  image: ghcr.io/aquasecurity/trivy:latest
  needs:
    - docker-build-dev
  variables:
    # Use fetch to get trivy.yaml and .trivyignore.yaml from the repository
    GIT_STRATEGY: fetch
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_AUTH_URL: $CI_REGISTRY
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL
        --config trivy.yaml
        --ignorefile .trivyignore.yaml
        ${CI_REGISTRY}/chrisleekr/homelab-infrastructure:dev-${CI_COMMIT_REF_SLUG}
  except:
    - master
    - main
  interruptible: true
  allow_failure: false

trivy-scan:
  stage: test
  image: ghcr.io/aquasecurity/trivy:latest
  needs:
    - docker-build
  variables:
    # Use fetch to get trivy.yaml and .trivyignore.yaml from the repository
    GIT_STRATEGY: fetch
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_AUTH_URL: $CI_REGISTRY
  script:
    - trivy image --exit-code 1 --severity HIGH,CRITICAL
        --config trivy.yaml
        --ignorefile .trivyignore.yaml
        ${CI_REGISTRY}/chrisleekr/homelab-infrastructure:latest
  only:
    - master
    - main
  allow_failure: false

# Documentation gate. GitLab validates but never publishes: GitHub Actions owns
# Pages (.github/workflows/docs.yml). Development happens in GitLab MRs, so this
# is the gate that actually catches drift first. Runs on every branch and MR,
# including master, so deleting a Terraform module or bumping an inventory pin
# trips it regardless of which remote the work lands on.
docs-build:
  stage: docs
  image: python:3.13-alpine
  # The top-level `default:` block attaches docker:27-dind to every job. This one
  # has no use for a Docker daemon, and starting one costs a privileged runner slot.
  services: []
  # Start immediately rather than queueing behind buildx and Trivy. Nothing here
  # consumes the built image, and serialising the docs gate behind the image build
  # would make it unrunnable on the very MR that breaks the image.
  needs: []
  interruptible: true
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  cache:
    # Keyed on the pin file, so only a dependency bump invalidates it.
    key:
      files:
        - docs/requirements.txt
    paths:
      - .cache/pip
  before_script:
    # bash: sync-versions.sh is #!/bin/bash and alpine ships ash only.
    # diffutils: BusyBox `diff` accepts -q but differs in output formatting from
    #   the GNU diff the script is developed against on macOS and CI.
    - apk add --no-cache bash diffutils
    - pip install --quiet -r docs/requirements.txt
  script:
    # Cheapest gates first, so a stale version table fails before the site build.
    - bash scripts/sync-versions.sh --check
    - python3 scripts/tests/test_check_docs.py
    - python3 scripts/check-docs.py --check
    - python3 stage2/preflight/scripts/check-prometheus-chart-compatibility.py
    - mkdocs build --strict --site-dir site
  artifacts:
    name: "docs-$CI_COMMIT_REF_SLUG"
    paths:
      - site/
    expire_in: 1 week
    expose_as: "Rendered documentation"
