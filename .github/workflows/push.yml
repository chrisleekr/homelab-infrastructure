name: Lint & Validate

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-24.04-arm
    # needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install hadolint
        run: |
          # Detect architecture for ARM64 runner compatibility
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
          curl -L "https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-${ARCH}" -o hadolint
          chmod +x hadolint
          mv hadolint /usr/local/bin/

      - name: Read TFLint pins
        id: tflint_pins
        shell: bash
        run: |
          version=$(sed -n 's/^ARG TFLINT_VERSION=//p' Dockerfile)
          arm64=$(sed -n 's/^ARG TFLINT_SHA256_ARM64=//p' Dockerfile)
          amd64=$(sed -n 's/^ARG TFLINT_SHA256_AMD64=//p' Dockerfile)
          test -n "$version"
          test -n "$arm64"
          test -n "$amd64"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          # setup-tflint hashes the release archive and accepts any entry in the list,
          # so both pins can be passed and the runner architecture picks itself.
          {
            printf 'checksums<<EOF\n'
            printf '%s\n%s\n' "$arm64" "$amd64"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: ${{ steps.tflint_pins.outputs.version }}
          checksums: ${{ steps.tflint_pins.outputs.checksums }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
