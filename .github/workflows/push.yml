name: Lint & Validate

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-24.04-arm
    # needs: build
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install hadolint
        run: |
          # Detect architecture for ARM64 runner compatibility
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ]; then ARCH="arm64"; fi
          curl -L "https://github.com/hadolint/hadolint/releases/download/v2.14.0/hadolint-linux-${ARCH}" -o hadolint
          chmod +x hadolint
          mv hadolint /usr/local/bin/

      - name: Install TFLint
        shell: bash
        run: |
          # Pins come from the Dockerfile so CI and the image lint with the same build.
          # Installed from the release archive rather than terraform-linters/setup-tflint:
          # the repository's allowed-actions policy does not cover that action, and an
          # uncovered action fails the whole workflow at startup, before any check runs exist.
          version=$(sed -n 's/^ARG TFLINT_VERSION=//p' Dockerfile)
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sha=$(sed -n 's/^ARG TFLINT_SHA256_ARM64=//p' Dockerfile) ;;
            x86_64|amd64) arch=amd64; sha=$(sed -n 's/^ARG TFLINT_SHA256_AMD64=//p' Dockerfile) ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          test -n "$version"
          test -n "$sha"
          archive="tflint_linux_${arch}.zip"
          curl -fsSL "https://github.com/terraform-linters/tflint/releases/download/${version}/${archive}" -o "$archive"
          printf '%s  %s\n' "$sha" "$archive" | sha256sum -c -
          unzip -o "$archive" -d /usr/local/bin
          rm "$archive"
          tflint --version

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          cache: true

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1
