# Container security scanning workflow
# Uses Trivy CLI via setup-trivy (trivy-action has .trivyignore bug)
# Per Trivy docs: https://trivy.dev/latest/docs/references/configuration/cli/trivy_image/
name: Container Security Scan

permissions:
  contents: read
  security-events: write

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "scripts/container/**"
      - ".github/workflows/container-security.yml"
      - ".trivyignore.yaml"
      - "stage1/requirements-pip.txt"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: "Build & Scan Container"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare container files
        run: |
          mkdir -p container
          cp -r scripts/container/* container/

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: homelab-infrastructure:scan
          # Disable cache to ensure fresh Alpine packages with security fixes
          # Per docker/build-push-action: https://github.com/docker/build-push-action#inputs
          no-cache: true

      # Install Trivy CLI (pinned version for consistency)
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2

      # Run Trivy scan with CLI (trivy-action has .trivyignore bug)
      # https://github.com/aquasecurity/trivy-action/issues/436
      - name: Run Trivy vulnerability scanner (table output for debugging)
        id: trivy-table
        run: |
          # First run with table format to show findings in logs
          trivy image \
            --config trivy.yaml \
            --ignorefile .trivyignore.yaml \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            homelab-infrastructure:scan

      - name: Run Trivy vulnerability scanner (SARIF output)
        id: trivy
        run: |
          trivy image \
            --config trivy.yaml \
            --ignorefile .trivyignore.yaml \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --format sarif \
            --output trivy-results.sarif \
            homelab-infrastructure:scan

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.39.3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
